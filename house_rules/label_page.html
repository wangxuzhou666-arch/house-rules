<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Findings labeling</title>
<style>
:root{--bg:#fafaf9;--fg:#1c1917;--muted:#78716c;--card:#fff;--line:#e7e5e4;--accent:#2563eb;--warn:#b45309}
@media (prefers-color-scheme:dark){:root{--bg:#1c1917;--fg:#f5f5f4;--muted:#a8a29e;--card:#292524;--line:#44403c;--accent:#60a5fa;--warn:#fbbf24}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
main{max-width:860px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:12px}
.meta{color:var(--muted);font-size:13px}.pre{color:var(--warn);font-size:13px}
pre{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;overflow:auto;font-size:12.5px}
label{margin-right:14px;white-space:nowrap}input[type=text]{width:100%;box-sizing:border-box;margin-top:8px;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
button{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:8px 14px;font-size:14px;cursor:pointer}
textarea{width:100%;height:120px;box-sizing:border-box;margin-top:8px;font:12px monospace;background:var(--card);color:var(--fg);border:1px solid var(--line)}
</style></head><body>
<header><strong>Label open findings</strong><span class="meta" id="count"></span><button id="copy">Copy JSON</button></header>
<main><div class="meta">batch_id <code id="batch"></code> - pick fixed / dismissed / false_positive, leave "skip" when unsure, click Copy JSON, then feed the result to <code>house-rules apply-labels</code>.</div>
<textarea id="out" readonly placeholder="The copied JSON appears here"></textarea><div id="list"></div></main>
<script type="application/json" id="data">__DATA__</script>
<script>
const data = JSON.parse(document.getElementById('data').textContent);
const OPTIONS = ['skip', 'fixed', 'dismissed', 'false_positive'];
const list = document.getElementById('list');
const state = {};
function el(tag, text, cls) { const n = document.createElement(tag); if (text !== undefined) n.textContent = text; if (cls) n.className = cls; return n; }
function updateCount() {
  const done = Object.values(state).filter(s => s.outcome !== 'skip').length;
  document.getElementById('count').textContent = `labeled ${done} / ${data.findings.length}`;
}
data.findings.forEach((f, idx) => {
  const preselect = data.preselect_false_positive.includes(f.id);
  state[f.id] = { outcome: preselect ? 'false_positive' : 'skip', note: '' };
  const card = el('div', undefined, 'card');
  card.append(el('div', `[${f.severity}] ${f.rule} - ${f.source} - ${f.display_id}`));
  card.append(el('div', `${f.file}:${f.line}  (sha ${f.sha})`, 'meta'));
  card.append(el('div', f.summary));
  card.append(el('div', f.failure_scenario, 'meta'));
  if (f.also.length) card.append(el('div', `also matches: ${f.also.join(', ')}`, 'meta'));
  if (f.snippet) card.append(el('pre', f.snippet));
  if (preselect) card.append(el('div', 'The skips file marks this one false_positive, so it is preselected - still needs your confirmation.', 'pre'));
  const row = el('div');
  OPTIONS.forEach(opt => {
    const label = el('label'); const radio = el('input');
    radio.type = 'radio'; radio.name = `r${idx}`; radio.value = opt; radio.checked = state[f.id].outcome === opt;
    radio.addEventListener('change', () => { state[f.id].outcome = opt; updateCount(); });
    label.append(radio, ' ' + opt); row.append(label);
  });
  const note = el('input'); note.type = 'text'; note.placeholder = 'Note (optional, becomes the evidence)';
  note.addEventListener('input', () => { state[f.id].note = note.value; });
  card.append(row, note); list.append(card);
});
document.getElementById('batch').textContent = data.batch_id;
updateCount();
document.getElementById('copy').addEventListener('click', async () => {
  const labels = data.findings.filter(f => state[f.id].outcome !== 'skip')
    .map(f => ({ id: f.id, outcome: state[f.id].outcome, note: state[f.id].note }));
  const text = JSON.stringify({ batch_id: data.batch_id, labels }, null, 1);
  const out = document.getElementById('out'); out.value = text; out.select();
  try { await navigator.clipboard.writeText(text); } catch (e) { document.execCommand('copy'); }
  document.getElementById('copy').textContent = `Copied ${labels.length}`;
});
</script></body></html>
